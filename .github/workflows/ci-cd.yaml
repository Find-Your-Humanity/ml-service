name: CI/CD Pipeline for ML Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

#      - name: Install dependencies (optional)
#        run: |
#          pip install --no-cache-dir -r requirements.txt || true
#        working-directory: ./backend/ml-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PROJECT_NAME }}.kr-central-2.kcr.dev
          username: ${{ secrets.ACCESS_KEY }}
          password: ${{ secrets.ACCESS_SECRET_KEY }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 불필요한 메타데이터 산출 비활성화로 빌드 가속
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.PROJECT_NAME }}.kr-central-2.kcr.dev/${{ secrets.REPOSITORY_NAME }}/ml-service:${{ github.sha }}
            ${{ secrets.PROJECT_NAME }}.kr-central-2.kcr.dev/${{ secrets.REPOSITORY_NAME }}/ml-service:latest

      - name: Checkout Kubernetes manifests repository
        uses: actions/checkout@v4
        with:
          repository: Find-Your-Humanity/deploy-manifests
          path: deploy-manifests
          token: ${{ secrets.PAT }}

      - name: Update image tag in Kubernetes manifest
        run: |
          IMAGE_TAG="${{ github.sha }}"
          sed -i -E "s|(image: kc-sfacspace\.kr-central-2\.kcr\.dev/team1-repo/ml-service:)([^ ]+)|\1$IMAGE_TAG|" deployment-ml-service.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment-ml-service.yaml
          git commit -m "Update ml-service image to ${{ github.sha }}" || echo "No changes to commit"
          git push
        working-directory: ./deploy-manifests/ml-service
